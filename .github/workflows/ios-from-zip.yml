name: Build iOS IPA from project.zip
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.zip', '.github/workflows/ios-from-zip.yml']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project.zip
        run: |
          test -f project.zip || { echo "Thiếu project.zip ở thư mục gốc repo"; exit 1; }
          rm -rf src && mkdir src
          unzip -q -o project.zip -d src
          Y=$(find src -path '*/ios/project.yml' | head -1)
          test -n "$Y" || { echo "Không thấy ios/project.yml trong zip"; find src | head -40; exit 1; }
          ROOT=$(dirname "$(dirname "$Y")")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"; ls "$ROOT"
      - name: Copy game into iOS project
        run: |
          rm -rf "$ROOT/ios/web" && mkdir -p "$ROOT/ios/web"
          cp -R "$ROOT/game/." "$ROOT/ios/web/"
          cp "$ROOT/ios/icon-1024.png" "$ROOT/ios/XomNongTrai/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd "$ROOT/ios" && xcodegen generate
      - name: Build (no signing)
        run: |
          cd "$ROOT/ios"
          xcodebuild -project XomNongTrai.xcodeproj -scheme XomNongTrai \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$ROOT/ios/build/Build/Products/Release-iphoneos/XomNongTrai.app" Payload/
          zip -qry XomNongTrai.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: XomNongTrai-ipa
          path: XomNongTrai.ipa
